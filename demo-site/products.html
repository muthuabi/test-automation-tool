<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - TechStore</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-brand">
                    <h1>🛍️ TechStore</h1>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html" class="active">Products</a></li>
                    <li>
                        <a href="#" id="cartLink">Cart <span id="cartCount">0</span></a>
                    </li>
                    <li><a href="#" id="logoutBtn" style="display:none;">Logout</a></li>
                    <li><a href="login.html" id="loginLink">Login</a></li>
                </ul>
            </div>
        </nav>

        <section class="products-section">
            <div class="filters">
                <h3>Filter by Category</h3>
                <label><input type="checkbox" class="category-filter" value="Laptops"> Laptops</label>
                <label><input type="checkbox" class="category-filter" value="Smartphones"> Smartphones</label>
                <label><input type="checkbox" class="category-filter" value="Accessories"> Accessories</label>
                <button class="btn btn-secondary" onclick="resetFilters()">Reset Filters</button>
            </div>

            <div class="products-container">
                <h2>Our Products</h2>
                <div id="productsGrid" class="products-grid">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 TechStore. All rights reserved.</p>
        </footer>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Shopping Cart</h2>
            <div id="cartItems"></div>
            <div class="modal-footer">
                <p>Total: $<span id="cartTotal">0.00</span></p>
                <button class="btn btn-primary">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
