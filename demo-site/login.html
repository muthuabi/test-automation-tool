<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test App Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      color: #667eea;
      font-size: 28px;
      margin-bottom: 5px;
    }

    .logo p {
      color: #999;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    #loginBtn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #loginBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    #loginBtn:active {
      transform: translateY(0);
    }

    #loginBtn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .demo-info {
      background-color: #e7f3ff;
      border: 1px solid #b3d9ff;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #004085;
    }

    .demo-info strong {
      display: block;
      margin-bottom: 5px;
    }

    .spinner {
      display: none;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 0.6s linear infinite;
      margin-right: 10px;
      position: absolute;
      left: 0;
      top: 0;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>🤖 Test App</h1>
      <p>Demo Login</p>
    </div>

    <div class="demo-info">
      <strong>Demo Credentials</strong>
      Username: testuser<br>
      Password: pass123
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          name="username"
          placeholder="Enter your username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button id="loginBtn" type="submit">Sign In</button>

      <div id="message" class="message"></div>
    </form>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('message');
      const loginBtn = document.getElementById('loginBtn');

      // Clear previous message
      messageEl.className = 'message';
      messageEl.textContent = '';

      // Validate credentials
      if (username === 'testuser' && password === 'pass123') {
        // Disable button and show loading
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';

        // Simulate processing
        setTimeout(() => {
          messageEl.className = 'message success';
          messageEl.innerHTML = '✓ Login successful! Redirecting...';

          // Redirect after 2 seconds
          setTimeout(() => {
            window.location.href = '/home';
          }, 2000);
        }, 1000);
      } else {
        // Show error message
        messageEl.className = 'message error';
        messageEl.textContent = '✗ Invalid username or password. Try testuser / pass123';
        loginBtn.disabled = false;
      }
    }

    // Pre-fill demo credentials for convenience
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('username').value = 'testuser';
      document.getElementById('password').value = 'pass123';
    });
  </script>
</body>
</html>
